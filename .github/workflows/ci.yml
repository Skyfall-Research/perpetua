name: CPU quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  # A newer push to the same PR supersedes its running checks; main keeps every run.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install CPU simulator user-space loaders
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgles2 libopengl0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.23'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - name: Build the documentation with warnings as errors
        run: uv run --group docs sphinx-build -W docs _build/html
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install CPU simulator user-space loaders
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgles2 libopengl0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.23'
          enable-cache: true
      - run: uv sync --locked
      - name: Run one of eight test groups
        run: >-
          uv run pytest -rs
          --splits 8 --group ${{ matrix.group }} --splitting-algorithm least_duration
          --store-durations --clean-durations --durations 25
          --cov --cov-report=
        env:
          COVERAGE_FILE: .coverage.${{ matrix.group }}
      # The groups are balanced by .test_durations. To refresh it, download
      # these artifacts from a run on main and merge them into that file.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-durations-${{ matrix.group }}
          path: .test_durations
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.group }}
          path: .coverage.${{ matrix.group }}
          include-hidden-files: true
          retention-days: 3
  # requires-python also allows 3.13: the locked environment must install there
  # and pass the contract, conformance, checkpoint and PPO tests. The full suite
  # runs on 3.12 (.python-version).
  python-313:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_PYTHON: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install CPU simulator user-space loaders
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgles2 libopengl0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.23'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -c "import sys; assert sys.version_info[:2] == (3, 13), sys.version"
      - name: Contract, conformance, checkpoint and PPO tests on Python 3.13
        run: >-
          uv run pytest -q -rs -n auto
          tests/test_contract.py tests/test_protocol.py tests/test_environment_conformance.py
          tests/test_checkpoint.py tests/test_ppo.py
  # The eight groups have no torch, so the PyTorch bridge would count as
  # untested and every torch-gated test would skip. This job runs the tests
  # that carry the `torch` marker (tests/conftest.py gives it to every
  # torch-gated test; the torch-guard job of learning.yml selects the same
  # way), fails if one of them skips, and adds them to the coverage total.
  torch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.23'
          enable-cache: true
      - run: uv sync --locked
      # A CPU wheel keeps the job small (the lockfile's Linux torch pulls CUDA).
      # Its version and its dependencies are the lockfile's: the export constrains
      # both, and best-match prefers the +cpu build of that version.
      - name: Install the locked torch as a CPU wheel
        run: |
          uv export --locked --no-hashes --no-default-groups --extra torch --no-emit-project -o "$RUNNER_TEMP/torch-lock.txt"
          uv pip install --python .venv/bin/python torch --constraint "$RUNNER_TEMP/torch-lock.txt" \
            --default-index https://pypi.org/simple --index https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match
          .venv/bin/python -c "import torch; assert torch.__version__.endswith('+cpu'), torch.__version__"
      - name: Run the torch-gated tests with coverage (none may skip)
        run: |
          .venv/bin/python -m pytest -q -rs -p no:cacheprovider --cov --cov-report= \
            -m torch --junitxml="$RUNNER_TEMP/torch-tests.xml"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          suite = ET.parse(os.environ['RUNNER_TEMP'] + '/torch-tests.xml').getroot().find('testsuite')
          skipped = [case.get('name') for case in suite.iter('testcase') if case.find('skipped') is not None]
          assert suite.findall('testcase') and not skipped, f'torch tests were skipped: {skipped}'
          PY
        env:
          COVERAGE_FILE: .coverage.torch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-torch
          path: .coverage.torch
          include-hidden-files: true
          retention-days: 3
  coverage:
    needs: [test, torch]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.23'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine the eight groups and report line and branch coverage
        # The floor is one point under the 88% measured when it was last raised.
        # Raise it when coverage rises; do not lower it to make a change pass.
        # coverage is pinned to the version in uv.lock, which wrote the data files.
        run: |
          uvx coverage@7.17.3 combine
          uvx coverage@7.17.3 report --skip-covered --sort=cover --fail-under=87
  wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install CPU simulator user-space loaders
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgles2 libopengl0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.23'
          enable-cache: true
      - run: uv sync --locked
      - run: uv build
      - name: Verify built wheel in an isolated environment
        run: |
          uv venv .wheel-test
          uv pip install --python .wheel-test/bin/python dist/*.whl
          .wheel-test/bin/python -I -c 'import perpetua; assert perpetua.__doc__'
          .wheel-test/bin/python -I examples/continual_grid.py --chunks 1 --drift cyclic
      - name: Verify optional training and environment integrations from the wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          wheel = next(Path('dist').glob('*.whl'))
          subprocess.run(['uv', 'pip', 'install', '--python', '.wheel-test/bin/python', f'{wheel}[training,interop,cpu-bridge,marl,jaxmarl,mjx]'], check=True)
          PY
          .wheel-test/bin/python -I -c "import jax, perpetua as pp; env = pp.make('mjx/Pendulum-v0'); env.init(jax.random.key(0))"
          .wheel-test/bin/python -I examples/train_ppo.py --updates 2 --checkpoint .wheel-test/checkpoint
          .wheel-test/bin/python -I examples/train_ppo.py --updates 1 --resume .wheel-test/checkpoint
          .wheel-test/bin/python -I examples/train_dqn.py --updates 2 --checkpoint .wheel-test/dqn-checkpoint
          .wheel-test/bin/python -I examples/train_dqn.py --updates 1 --resume .wheel-test/dqn-checkpoint
          .wheel-test/bin/python -I examples/train_dqn.py --algorithm iql --updates 2 --checkpoint .wheel-test/iql-checkpoint
          .wheel-test/bin/python -I examples/train_dqn.py --algorithm iql --updates 1 --resume .wheel-test/iql-checkpoint
          .wheel-test/bin/python -I examples/train_sac.py --updates 2 --checkpoint .wheel-test/sac-checkpoint
          .wheel-test/bin/python -I examples/train_sac.py --updates 1 --resume .wheel-test/sac-checkpoint
          .wheel-test/bin/python -I examples/control_ppo.py --backend gymnax --updates 2
          .wheel-test/bin/python -I examples/control_ppo.py --backend envpool --updates 2 --num-envs 4
          .wheel-test/bin/python -I examples/control_ppo.py --backend gymnasium --updates 2 --checkpoint .wheel-test/cpu-checkpoint
          .wheel-test/bin/python -I examples/control_ppo.py --backend gymnasium --updates 1 --resume .wheel-test/cpu-checkpoint
          .wheel-test/bin/python -I examples/train_marl.py --updates 2 --checkpoint .wheel-test/marl-checkpoint
          .wheel-test/bin/python -I examples/train_marl.py --updates 1 --resume .wheel-test/marl-checkpoint
          .wheel-test/bin/python -I examples/train_marl.py --backend pettingzoo --updates 1
          .wheel-test/bin/python -I examples/train_marl.py --backend partner --updates 3 --checkpoint .wheel-test/partner-checkpoint
          .wheel-test/bin/python -I examples/train_marl.py --backend partner --updates 2 --resume .wheel-test/partner-checkpoint
          .wheel-test/bin/python -I examples/train_marl.py --backend opponent --updates 3 --checkpoint .wheel-test/opponent-checkpoint
          .wheel-test/bin/python -I examples/train_marl.py --backend opponent --updates 2 --resume .wheel-test/opponent-checkpoint
          .wheel-test/bin/python -I examples/train_marl.py --backend jaxmarl --updates 2 --checkpoint .wheel-test/jaxmarl-checkpoint
          .wheel-test/bin/python -I examples/train_marl.py --backend jaxmarl --updates 1 --resume .wheel-test/jaxmarl-checkpoint
          .wheel-test/bin/python -I examples/train_marl.py --backend jaxmarl-scripted --updates 2 --checkpoint .wheel-test/jaxmarl-scripted-checkpoint
          .wheel-test/bin/python -I examples/train_marl.py --backend jaxmarl-scripted --updates 1 --resume .wheel-test/jaxmarl-scripted-checkpoint
          .wheel-test/bin/python -I examples/train_marl.py --backend pettingzoo-snapshot --updates 3 --checkpoint .wheel-test/mpe-checkpoint
          .wheel-test/bin/python -I examples/train_marl.py --backend pettingzoo-snapshot --updates 2 --resume .wheel-test/mpe-checkpoint
          .wheel-test/bin/python -I examples/compute_ppo.py --chunks 2 --checkpoint .wheel-test/compute-checkpoint
          .wheel-test/bin/python -I examples/compute_ppo.py --chunks 1 --resume .wheel-test/compute-checkpoint
          .wheel-test/bin/python -I examples/compute_ppo.py --replay .wheel-test/compute-checkpoint
          .wheel-test/bin/python -I examples/compute_ppo.py --mode measured --quantum-ns 1000000000 --chunks 1 --checkpoint .wheel-test/measured-checkpoint
          .wheel-test/bin/python -I examples/compute_ppo.py --mode measured --quantum-ns 1000000000 --replay .wheel-test/measured-checkpoint
          .wheel-test/bin/python -I examples/compute_ppo.py --backend pettingzoo-snapshot --mode measured --quantum-ns 1000000000 --chunks 3 --checkpoint .wheel-test/mpe-timed-checkpoint
          .wheel-test/bin/python -I examples/compute_ppo.py --backend pettingzoo-snapshot --mode measured --quantum-ns 1000000000 --replay .wheel-test/mpe-timed-checkpoint
      - name: Build and verify optional headless EnvPool snapshots
        env:
          # The report lets the step fail if any of its tests was skipped.
          PYTEST_ADDOPTS: --junitxml=.wheel-test/snapshot-tests.xml
        run: |
          uv build native/envpool_snapshot --wheel --out-dir .native-dist
          python - <<'PY'
          from pathlib import Path
          import subprocess
          wheel = next(Path('.native-dist').glob('*.whl'))
          for target in ('.venv/bin/python', '.wheel-test/bin/python'):
              subprocess.run(['uv', 'pip', 'install', '--python', target, str(wheel)], check=True)
          PY
          .venv/bin/python -m pytest -rs tests/test_envpool_snapshot.py tests/test_cpu_snapshot_process.py 'tests/test_environment_conformance.py::test_all_checks[envpool/CartPole-v1@snapshot]'
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse('.wheel-test/snapshot-tests.xml').getroot().find('testsuite')
          skipped = [case.get('name') for case in suite.iter('testcase') if case.find('skipped') is not None]
          assert suite.findall('testcase') and not skipped, f'snapshot tests were skipped: {skipped}'
          PY
          .wheel-test/bin/python -I examples/control_ppo.py --backend envpool-snapshot --updates 2 --num-envs 4 --checkpoint .wheel-test/envpool-checkpoint
          .wheel-test/bin/python -I examples/control_ppo.py --backend envpool-snapshot --updates 1 --num-envs 4 --resume .wheel-test/envpool-checkpoint
