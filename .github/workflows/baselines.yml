name: Record baselines
# tests/test_baselines.py compares seeded results on Linux with
# tests/fixtures/baselines-linux-x86_64.json, which has to be recorded on a
# runner like the ones the tests run on. Run this by hand after an intended
# change to seeded results, download the artifact and commit the file at that
# path. Each run also prints how far its recording is from the committed
# fixture: the spread between runner machines that LINUX_RTOL has to cover.
on:
  workflow_dispatch:
  # A manual run needs this file on the default branch. Before that, pushing
  # a branch named record-baselines/<anything> runs it from that branch.
  push:
    branches: ['record-baselines/**']
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install CPU simulator user-space loaders
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgles2 libopengl0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.11.23'
          enable-cache: true
      - run: uv sync --locked
      - name: Name the machine
        run: lscpu | grep -E 'Model name|Flags'
      - name: Record twice, in separate processes
        run: |
          mkdir "$RUNNER_TEMP/first" "$RUNNER_TEMP/second"
          uv run python scripts/record_baselines.py --output "$RUNNER_TEMP/first/baselines-linux-x86_64.json"
          uv run python scripts/record_baselines.py --output "$RUNNER_TEMP/second/baselines-linux-x86_64.json"
      - name: The two recordings must be the same file
        run: |
          if ! cmp "$RUNNER_TEMP/first/baselines-linux-x86_64.json" "$RUNNER_TEMP/second/baselines-linux-x86_64.json"; then
            uv run python scripts/record_baselines.py --compare \
              --recording "$RUNNER_TEMP/second/baselines-linux-x86_64.json" \
              --against "$RUNNER_TEMP/first/baselines-linux-x86_64.json" || true
            echo "::error::Two recordings on one machine differ, so the seeded runs are not deterministic here."
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baselines-linux-x86_64
          path: ${{ runner.temp }}/first/baselines-linux-x86_64.json
          if-no-files-found: error
          retention-days: 30
      - name: Largest relative difference from the committed fixture
        shell: bash  # bash -eo pipefail: a failed comparison must fail the step
        run: |
          if [ -f tests/fixtures/baselines-linux-x86_64.json ]; then
            uv run python scripts/record_baselines.py --compare \
              --recording "$RUNNER_TEMP/first/baselines-linux-x86_64.json" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::No tests/fixtures/baselines-linux-x86_64.json is committed yet; nothing to compare with."
          fi
