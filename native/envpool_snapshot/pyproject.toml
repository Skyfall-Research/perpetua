[build-system]
requires = ["scikit-build-core>=0.11,<1", "pybind11==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "perpetua-envpool-snapshot"
version = "0.0.1a0"
description = "Optional headless EnvPool CartPole checkpoint binding for Perpetua"
requires-python = ">=3.12"

[tool.scikit-build]
wheel.packages = []
build.tool-args = ["-j4"]
build.targets = ["perpetua_envpool_snapshot"]
